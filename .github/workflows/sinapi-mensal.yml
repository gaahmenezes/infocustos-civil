# SINAPI do mês, automática: todo dia procura na CAIXA o zip do mês seguinte ao último carregado.
# Saiu: baixa, lê (Sergipe, sem desoneração), confere cada composição com o custo publicado e, se passar,
# grava dados/sinapi_AAAA-MM.sqlite.gz na main (a Render publica sozinha) e abre um aviso (issue).
# Ainda não saiu: termina sem mudar nada. Barrado pela CAIXA ou conferência com problema: abre um aviso e falha.
name: SINAPI mensal

on:
  schedule:
    - cron: '13 11 * * *'   # todo dia, 08:13 em Brasília
  workflow_dispatch:
    inputs:
      mes:
        description: 'Mês (AAAA-MM). Vazio = o seguinte ao último carregado'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: sinapi-mensal
  cancel-in-progress: false

jobs:
  sinapi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Buscar, ler e conferir a SINAPI do mês
        id: sinapi
        env:
          MES: ${{ inputs.mes }}
        run: |
          set +e
          if [ -n "$MES" ]; then
            [[ "$MES" =~ ^20[0-9]{2}-(0[1-9]|1[0-2])$ ]] || { echo "Mês inválido: use AAAA-MM"; exit 1; }
            python3 extratores/sinapi_do_mes.py --mes "$MES"
          else
            python3 extratores/sinapi_do_mes.py
          fi
          echo "codigo=$?" >> "$GITHUB_OUTPUT"

      - name: Conferir que a base completa monta com o mês novo
        if: steps.sinapi.outputs.resultado == 'publicado'
        run: |
          mkdir -p /tmp/base
          for gz in dados/*_20*.sqlite.gz; do gunzip -c "$gz" > "/tmp/base/$(basename "$gz" .gz)"; done
          python3 extratores/juntar_referencias.py /tmp/base/orse_sinapi.sqlite /tmp/base/orse_sinapi_20*.sqlite /tmp/base/sinapi_20*.sqlite /tmp/base/sicro_20*.sqlite
          python3 app/build_index.py /tmp/base/orse_sinapi.sqlite

      - name: Gravar na main (a Render publica)
        if: steps.sinapi.outputs.resultado == 'publicado'
        env:
          MES: ${{ steps.sinapi.outputs.mes }}
          DETALHE: ${{ steps.sinapi.outputs.detalhe }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dados/sinapi_${MES}.sqlite.gz"
          git commit -m "SINAPI de ${MES} (Sergipe, CAIXA), pela tarefa automática" -m "$DETALHE"
          git push origin HEAD:main

      - name: Aviso de mês publicado
        if: steps.sinapi.outputs.resultado == 'publicado'
        env:
          GH_TOKEN: ${{ github.token }}
          MES: ${{ steps.sinapi.outputs.mes }}
          DETALHE: ${{ steps.sinapi.outputs.detalhe }}
        run: |
          gh issue create --title "SINAPI de ${MES} publicada" --body "$(printf 'A tarefa automática baixou a SINAPI de %s da CAIXA, conferiu e gravou na main. A Render publica em alguns minutos.\n\n%s' "$MES" "$DETALHE")"

      - name: Aviso de problema
        if: steps.sinapi.outputs.codigo != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          MES: ${{ steps.sinapi.outputs.mes }}
          RESULTADO: ${{ steps.sinapi.outputs.resultado }}
          DETALHE: ${{ steps.sinapi.outputs.detalhe }}
          REGISTRO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULTADO" = "bloqueado" ]; then problema="download barrado pela CAIXA"; else problema="precisa de atenção"; fi
          titulo="SINAPI de ${MES:-mês seguinte}: ${problema}"
          # um aviso por mês e problema (a tarefa roda todo dia)
          if [ -z "$(gh issue list --state open --search "in:title \"$titulo\"" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$titulo" --body "$(printf 'Resultado: %s\n\n%s\n\nNada foi gravado. Registro da tarefa: %s' "${RESULTADO:-erro}" "$DETALHE" "$REGISTRO")"
          fi
          exit 1
