<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InfoCustos Civil — Consulta ORSE e SINAPI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <span class="marca-nome">InfoCustos Civil</span>
      <span class="marca-produto">Consulta de preços de obra</span>
      <nav class="abas" aria-label="Seções">
        <a href="#/" data-aba="consulta">Consulta</a>
        <a href="#/orcamentos" data-aba="orcamentos">Orçamentos</a>
      </nav>
    </div>
    <form class="busca" id="form-busca" role="search" autocomplete="off">
      <label for="q" class="sr">Buscar serviço ou insumo</label>
      <input id="q" name="q" type="search" placeholder="Buscar por descrição ou código — ex.: alvenaria bloco 14, 00003, cimento cp ii"
             autofocus spellcheck="false">
      <div class="filtros">
        <div class="segmentos" role="radiogroup" aria-label="Base de preços" data-filtro="base">
          <button type="button" role="radio" data-v="todas" aria-checked="true">Todas</button>
          <button type="button" role="radio" data-v="ORSE" aria-checked="false">ORSE</button>
          <button type="button" role="radio" data-v="SINAPI" aria-checked="false">SINAPI</button>
        </div>
        <div class="segmentos" role="radiogroup" aria-label="Tipo de item" data-filtro="tipo">
          <button type="button" role="radio" data-v="todos" aria-checked="true">Tudo</button>
          <button type="button" role="radio" data-v="servico" aria-checked="false">Serviços</button>
          <button type="button" role="radio" data-v="insumo" aria-checked="false">Insumos</button>
        </div>
      </div>
    </form>
    <div class="referencia" id="referencia" title="Data-base dos preços"></div>
  </header>

  <main class="area">
    <section class="resultados" id="resultados" aria-label="Resultados da busca">
      <div class="resultados-topo">
        <p id="contagem" aria-live="polite"></p>
        <a id="exportar-busca" class="link-acao" href="#" download>Exportar resultado</a>
      </div>
      <ol id="lista" class="lista"></ol>
    </section>

    <section class="detalhe" id="detalhe" aria-live="polite">
      <div class="vazio" id="inicio">
        <h1>Encontre um serviço e veja do que ele é feito.</h1>
        <p>Busque pela descrição ou pelo código. Cada composição abre com os insumos, coeficientes e custos, e pode ser exportada para Excel.</p>
        <div class="sugestoes" id="sugestoes"></div>
      </div>
    </section>
  </main>

  <template id="tpl-resultado">
    <li><button type="button" class="res">
      <span class="res-cod"></span>
      <span class="res-desc"></span>
      <span class="res-meta"></span>
      <span class="res-preco"></span>
    </button></li>
  </template>

  <dialog id="dlg-adicionar" class="dialogo" aria-labelledby="dlg-titulo">
    <form method="dialog" id="form-adicionar">
      <h2 id="dlg-titulo">Adicionar ao orçamento</h2>
      <p class="sub" id="dlg-item"></p>
      <label>Orçamento<select id="dlg-orc" required></select></label>
      <label id="dlg-novo-wrap" hidden>Nome do novo orçamento<input id="dlg-novo" maxlength="200"></label>
      <label>Etapa<select id="dlg-etapa"></select></label>
      <label>Quantidade<input id="dlg-qtd" inputmode="decimal" value="1" required></label>
      <p class="erro-campo" id="dlg-erro" role="alert"></p>
      <div class="dlg-acoes">
        <button type="button" class="botao" value="cancel" id="dlg-cancelar">Cancelar</button>
        <button type="submit" class="botao primario" id="dlg-ok">Adicionar</button>
      </div>
    </form>
  </dialog>
  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>

  <script src="/static/app.js"></script>
  <script src="/static/orcamento.js"></script>
</body>
</html>
